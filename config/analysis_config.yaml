project:
  # All relative paths are resolved from the Git repository root.
  root: .
  input_dir: data/Summary
  result_dir: results
  figure_dir: figures
  log_dir: logs
  metadata: metadata/sample_metadata.tsv
  marker_file: resources/markers/ovary_markers.yaml
  pathway_file: resources/gene_sets/pathway_gene_sets.yaml
  cluster_labels: metadata/cluster_labels.tsv
  random_seed: 20260811

resources:
  no_card_memory_gib: 2
  recommended_compute_memory_gib: 64
  recommended_compute_cpus: 16
  guard_heavy_jobs: true

ingest:
  var_names: gene_symbols
  make_unique: true
  gene_expression_only: true
  barcode_separator: "-"
  counts_layer: counts

qc:
  mouse_mt_prefix: "mt-"
  mouse_ribo_regex: "^Rp[sl]"
  mouse_hb_regex: "^Hb(?!p)"
  min_genes_initial: 200
  min_cells_per_gene: 10
  counts_n_mads: 5.0
  genes_n_mads: 5.0
  mt_n_mads: 3.0
  hard_mt_pct: null
  expected_doublet_rate: 0.06
  apply_scrublet: true
  filter_predicted_doublets: true

preprocess:
  target_sum: 10000
  hvg_flavor: seurat_v3
  n_top_hvg: 3000
  hvg_batch_key: library_id
  scale_max_value: 10
  n_pcs: 50
  n_neighbors: 15
  use_n_pcs: 40

stage1_exploratory:
  # Conservative first-pass QC agreed after threshold sensitivity review.
  min_genes_absolute: 200
  low_genes_n_mads: 5.0
  mt_moderate_lower_pct: 5.0
  mt_extreme_pct: 25.0
  high_doublet_score_fraction: 0.01
  n_neighbors: 15
  use_n_pcs: 30
  leiden_resolutions: [0.3, 0.5, 0.8]
  primary_resolution: 0.5

integration:
  primary: harmony
  batch_key: library_id
  retain_unintegrated_graph: true
  compare_with_unintegrated: true

integration_qc_review:
  # Diagnostic triage only. None of these thresholds delete cells or clusters.
  top_marker_n: 50
  small_cluster_max_cells: 150
  library_specific_fraction: 0.75
  doublet_review:
    metric_quantile: 0.75
    predicted_enrichment: 1.5
    predicted_min_fraction: 0.01
    incompatible_min_fraction: 0.05
  low_quality_review:
    low_rna_quantile: 0.25
    mt25_enrichment: 3.0
    mt25_min_fraction: 0.05
    low_genes_5mad_min_fraction: 0.05

clustering:
  resolutions: [0.3, 0.5, 0.8, 1.0]
  primary_resolution: 0.5

annotation:
  cluster_key: leiden_0.5
  broad_label_key: cell_type_broad
  final_label_key: cell_type_final
  run_celltypist: false
  celltypist_model: Immune_All_Low.pkl
  celltypist_immune_only: true
  provisional_confidence: 0.5
  uncertain_confidence: 0.2

broad_annotation_review:
  # Cluster-level major-lineage curation only; no subclustering or group comparison.
  cluster_key: leiden_0.5
  marker_section: major_annotation
  mapping_file: metadata/broad_cluster_annotation.tsv
  output_dir: results/annotation
  figure_dir: figures/annotation
  top_marker_file: results/04_cluster_top_markers.tsv
  integration_review_file: results/integration_qc_review/cluster_marker_review.tsv
  cell_cycle_genes:
    [Mki67, Top2a, Cenpf, Cdc20, Tpx2, Cenpa, Ube2c, Cenpe, Cdca8, Cks2,
     Prc1, Hmmr, Ckap2l, Bub1b, Ccnb1, Racgap1, Ect2, Anln, Cep55, Diaph3,
     Aspm, Kif23, Knstrn, Ccnb2, Tacc3, Dlgap5, Smc4, Kif11, Rrm2, Ccna2,
     Bub1, Ncapd2, Stmn1, Birc5, Cdk1, Cks1b, Smc2, Knl1, Incenp, Pbk,
     Kif22, Aurka, Plk1, Nusap1]

follicular_subclustering:
  # Local follicular/steroidogenic analysis only; the whole-ovary object is read-only.
  source_cluster_key: leiden_0.5
  source_clusters: ["3", "5", "7", "12", "13", "4", "9", "24", "6", "25"]
  counts_layer: counts
  output_dir: results/subclustering
  figure_dir: figures/subclustering
  n_top_hvg: 3000
  hvg_flavor: seurat_v3
  hvg_batch_key: library_id
  n_pcs: 50
  neighbor_pc_candidates: [30, 40]
  use_n_pcs: 40
  n_neighbors: 15
  resolutions: [0.2, 0.3, 0.5, 0.8]
  primary_resolution: 0.5
  marker_top_n: 100
  cell_cycle_genes:
    s_phase: [Mcm5, Pcna, Tyms, Fen1, Mcm2, Mcm4, Rrm1, Ung, Gins2, Mcm6,
              Cdca7, Dtl, Prim1, Uhrf1, Mlf1ip, Hells, Rfc2, Rpa2, Nasp, Rad51ap1,
              Gmnn, Wdr76, Slbp, Ccne2, Ubr7, Pold3, Msh2, Atad2, Rad51, Rrm2,
              Cdc45, Cdc6, Exo1, Tipin, Dscc1, Blm, Casp8ap2, Usp1, Clspn, Pola1,
              Chaf1b, Brip1, E2f8]
    g2m_phase: [Hmgb2, Cdk1, Nusap1, Ube2c, Birc5, Tpx2, Top2a, Ndc80, Cks2,
                Nuf2, Cks1b, Mki67, Tmpo, Cenpf, Tacc3, Fam64a, Smc4, Ccnb2,
                Ckap2l, Ckap2, Aurkb, Bub1, Kif11, Anp32e, Tubb4b, Gtse1, Kif20b,
                Hjurp, Cdca3, Hn1, Cdc20, Ttk, Cdc25c, Kif2c, Rangap1, Ncapd2,
                Dlgap5, Cdca2, Cdca8, Ect2, Kif23, Hmmr, Aurka, Psf3]

follicular_annotation_review:
  # Marker-guided local annotation only; no cells are removed and no condition
  # comparison is performed in this stage.
  output_dir: results/subclustering
  figure_dir: figures/subclustering
  annotated_object: results/subclustering/follicular_steroidogenic_annotated.h5ad
  lineage_high_percentile: 75.0
  within_library_doublet_quantile: 0.75
  within_library_high_qc_quantile: 0.50
  evidence_top_n: 30

annotation_consolidation:
  # Consolidate already-reviewed labels into a new main object only.
  input_object: results/04_annotated.h5ad
  local_object: results/subclustering/follicular_steroidogenic_annotated.h5ad
  local_cell_labels: results/subclustering/follicular_cell_labels.tsv
  cluster8_review: results/subclustering/cluster8_single_cell_review.tsv
  output_object: results/05_annotation_v1.h5ad
  output_dir: results/annotation_v1
  counts_layer: counts
  global_cluster_key: leiden_0.5
  local_cluster_key: follicular_leiden

downstream:
  # Subset-specific exploratory settings. These do not alter the full atlas.
  subclustering:
    hvg_flavor: seurat_v3
    n_top_hvg: 3000
    hvg_batch_key: library_id
    n_pcs: 50
    use_n_pcs: 40
    n_neighbors: 15
    resolutions: [0.2, 0.3, 0.5, 0.8]
    primary_resolution: 0.5
    marker_top_n: 100

pseudobulk:
  sample_key: library_id
  group_key: group
  cell_type_key: cell_type_final
  min_cells_per_sample_cell_type: 30
  min_samples_per_group: 3
  design: "~group"
  contrasts:
    - [group, OC, Y]
    - [group, OT, OC]
    - [group, OT, Y]
  alpha: 0.05
  min_total_counts_gene: 10
  n_cpus: 4

pathway:
  ranking_column: stat
  permutations: 1000
  min_size: 5
  max_size: 500
  rescue_min_abs_aging_lfc: 0.25
