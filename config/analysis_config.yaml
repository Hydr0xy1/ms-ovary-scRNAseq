project:
  # All relative paths are resolved from the Git repository root.
  root: .
  input_dir: data/Summary
  result_dir: results
  figure_dir: figures
  log_dir: logs
  metadata: metadata/sample_metadata.tsv
  marker_file: resources/markers/ovary_markers.yaml
  pathway_file: resources/gene_sets/pathway_gene_sets.yaml
  cluster_labels: metadata/cluster_labels.tsv
  random_seed: 20260811

resources:
  no_card_memory_gib: 2
  recommended_compute_memory_gib: 64
  recommended_compute_cpus: 16
  guard_heavy_jobs: true

ingest:
  var_names: gene_symbols
  make_unique: true
  gene_expression_only: true
  barcode_separator: "-"
  counts_layer: counts

qc:
  mouse_mt_prefix: "mt-"
  mouse_ribo_regex: "^Rp[sl]"
  mouse_hb_regex: "^Hb(?!p)"
  min_genes_initial: 200
  min_cells_per_gene: 10
  counts_n_mads: 5.0
  genes_n_mads: 5.0
  mt_n_mads: 3.0
  hard_mt_pct: null
  expected_doublet_rate: 0.06
  apply_scrublet: true
  filter_predicted_doublets: true

preprocess:
  target_sum: 10000
  hvg_flavor: seurat_v3
  n_top_hvg: 3000
  hvg_batch_key: library_id
  scale_max_value: 10
  n_pcs: 50
  n_neighbors: 15
  use_n_pcs: 40

stage1_exploratory:
  # Conservative first-pass QC agreed after threshold sensitivity review.
  min_genes_absolute: 200
  low_genes_n_mads: 5.0
  mt_moderate_lower_pct: 5.0
  mt_extreme_pct: 25.0
  high_doublet_score_fraction: 0.01
  n_neighbors: 15
  use_n_pcs: 30
  leiden_resolutions: [0.3, 0.5, 0.8]
  primary_resolution: 0.5

integration:
  primary: harmony
  batch_key: library_id
  retain_unintegrated_graph: true
  compare_with_unintegrated: true

integration_qc_review:
  # Diagnostic triage only. None of these thresholds delete cells or clusters.
  top_marker_n: 50
  small_cluster_max_cells: 150
  library_specific_fraction: 0.75
  doublet_review:
    metric_quantile: 0.75
    predicted_enrichment: 1.5
    predicted_min_fraction: 0.01
    incompatible_min_fraction: 0.05
  low_quality_review:
    low_rna_quantile: 0.25
    mt25_enrichment: 3.0
    mt25_min_fraction: 0.05
    low_genes_5mad_min_fraction: 0.05

clustering:
  resolutions: [0.3, 0.5, 0.8, 1.0]
  primary_resolution: 0.5

annotation:
  cluster_key: leiden_0.5
  broad_label_key: cell_type_broad
  final_label_key: cell_type_final
  run_celltypist: false
  celltypist_model: Immune_All_Low.pkl
  celltypist_immune_only: true
  provisional_confidence: 0.5
  uncertain_confidence: 0.2

broad_annotation_review:
  # Cluster-level major-lineage curation only; no subclustering or group comparison.
  cluster_key: leiden_0.5
  marker_section: major_annotation
  mapping_file: metadata/broad_cluster_annotation.tsv
  output_dir: results/annotation
  figure_dir: figures/annotation
  top_marker_file: results/04_cluster_top_markers.tsv
  integration_review_file: results/integration_qc_review/cluster_marker_review.tsv
  cell_cycle_genes:
    [Mki67, Top2a, Cenpf, Cdc20, Tpx2, Cenpa, Ube2c, Cenpe, Cdca8, Cks2,
     Prc1, Hmmr, Ckap2l, Bub1b, Ccnb1, Racgap1, Ect2, Anln, Cep55, Diaph3,
     Aspm, Kif23, Knstrn, Ccnb2, Tacc3, Dlgap5, Smc4, Kif11, Rrm2, Ccna2,
     Bub1, Ncapd2, Stmn1, Birc5, Cdk1, Cks1b, Smc2, Knl1, Incenp, Pbk,
     Kif22, Aurka, Plk1, Nusap1]

pseudobulk:
  sample_key: library_id
  group_key: group
  cell_type_key: cell_type_final
  min_cells_per_sample_cell_type: 30
  min_samples_per_group: 3
  design: "~group"
  contrasts:
    - [group, OC, Y]
    - [group, OT, OC]
    - [group, OT, Y]
  alpha: 0.05
  min_total_counts_gene: 10
  n_cpus: 4

pathway:
  ranking_column: stat
  permutations: 1000
  min_size: 5
  max_size: 500
  rescue_min_abs_aging_lfc: 0.25
