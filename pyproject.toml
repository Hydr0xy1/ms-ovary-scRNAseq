[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-ovary-scrna"
version = "0.1.0"
description = "Reproducible Scanpy workflow for the mouse ovary MRJP1 experiment"
readme = "README_ANALYSIS.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require the server dataset or full analysis environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
